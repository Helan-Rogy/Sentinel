[project]
name = "sentinel"
version = "0.1.0"
description = "Sentinel: AI-powered ransomware detection and response agent"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
endpoint = ["watchdog>=4", "psutil>=5.9"]
ml = ["scikit-learn>=1.4", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["contracts*", "server*", "lab*", "analyzers*", "detection*", "endpoint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
